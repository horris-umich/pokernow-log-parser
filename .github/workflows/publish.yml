name: Publish to PyPI

# Publishes the package to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API tokens or secrets required.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   PyPI project name : pokernow-log-parser
#   Owner             : horris-umich
#   Repository name   : pokernow-log-parser
#   Workflow name     : publish.yml
#   Environment name  : pypi

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build & test dependencies
        run: python -m pip install --upgrade build ".[dev]"

      - name: Run tests (gate the release)
        run: pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pokernow-log-parser
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
